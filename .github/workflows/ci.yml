name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # un job par service (matrix) : build, scan, et push sur GHCR pour les tags v*
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile.multi
          - service: notifier
            dockerfile: Dockerfile
    steps:
      # actions epinglees par SHA (un tag peut etre deplace, un SHA non)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Nom de l'image
        id: img
        # GHCR veut un nom en minuscules
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/${{ matrix.dockerfile }}
          load: true
          tags: ${{ steps.img.outputs.name }}:ci

      - name: Scan Trivy ${{ matrix.service }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.name }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # gate bloquante sur les tags v*, juste informatif sinon
          exit-code: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          format: table

      - name: Login GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.service }}:${{ github.ref_name }}
        if: startsWith(github.ref, 'refs/tags/v')
        # on pousse l'image deja scannee (pas de rebuild)
        run: |
          docker tag "${{ steps.img.outputs.name }}:ci" "${{ steps.img.outputs.name }}:${{ github.ref_name }}"
          docker push "${{ steps.img.outputs.name }}:${{ github.ref_name }}"

  # CD : seulement sur les tags v*, une fois les deux images publiees
  deploy:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.ref_name }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      # --- cas 1 : un vrai serveur est configure (secrets DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY)
      - name: Deploiement SSH sur le serveur cible
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            cd /opt/demo-api
            git fetch --tags && git checkout "$IMAGE_TAG"
            docker compose pull
            docker compose up -d --no-build --wait
            docker image prune -f

      # --- cas 2 : pas de serveur -> deploiement simule sur le runner GitHub
      #     (meme commandes que sur le serveur : pull des images GHCR + up -d, sans build)
      - name: "Simulation : checkout du tag"
        if: env.DEPLOY_HOST == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Simulation : login GHCR"
        if: env.DEPLOY_HOST == ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Simulation : config du serveur (.env + secret)"
        if: env.DEPLOY_HOST == ''
        run: |
          cp .env.example .env
          mkdir -p secrets
          openssl rand -base64 18 > secrets/db_password.txt

      - name: "Simulation : docker compose pull && up -d"
        if: env.DEPLOY_HOST == ''
        run: |
          docker compose pull
          docker compose up -d --no-build --wait
          docker compose images
          docker compose ps

      - name: "Simulation : verification de la stack deployee"
        if: env.DEPLOY_HOST == ''
        run: |
          curl -sf localhost:8080/health
          echo
          curl -sf -X POST localhost:8080/products -H "Content-Type: application/json" \
            -d '{"name":"Produit deploye","price_cents":100}'
          echo
          sleep 2
          docker compose logs notifier | tee notifier.log
          grep -q 'Produit deploye' notifier.log
          echo "notifier a bien recu la notification"
